# Cấu hình Alembic (REQ-008). Chạy mọi lệnh alembic từ thư mục backend/.
[alembic]
script_location = migrations
prepend_sys_path = .
# Tên file revision: <số thứ tự 4 chữ số>_<mo_ta>.py (xem docs/db-migrations.md)
file_template = %%(rev)s_%%(slug)s
# URL lấy từ biến môi trường DATABASE_URL trong migrations/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
